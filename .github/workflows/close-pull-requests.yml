# このリポジトリはフィードバックを Issue だけで受け付ける。
# 所有者・メンバー・共同作業者以外が開いたプルリクエストは、案内のコメントを付けて自動で閉じる
name: プルリクエストを閉じる

on:
  # 外部からのプルリクエストにもコメント・クローズの権限を持たせるため pull_request_target を使う。
  # プルリクエストのコードは取得も実行もしない(コメントと状態の変更だけ)
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  close:
    if: ${{ !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const number = context.payload.pull_request.number
            const newIssue = `https://github.com/${context.repo.owner}/${context.repo.repo}/issues/new/choose`
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: number,
              body: [
                'プルリクエストをありがとうございます。',
                `このリポジトリでは、プルリクエストは受け付けていません。不具合・タグの訂正・要望は [Issue](${newIssue}) からお知らせください。`,
              ].join('\n\n'),
            })
            await github.rest.pulls.update({ ...context.repo, pull_number: number, state: 'closed' })
